<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepMaster — Software Engineering Interview Preparation</title>
    <meta name="description" content="Comprehensive software engineering interview prep covering OS, DSA, OOP, DBMS, system architecture, and projects." />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('prepmaster-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = (stored === 'dark' || stored === 'light') ? stored : (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
